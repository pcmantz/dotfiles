# ~/.config/mise/config.toml

# Don't use this, just put it in .zshrc.local
[env]

[tools]

# programming languages
deno = "latest"
elixir = "latest"
erlang = "latest"
go = "latest"
nodejs = "latest"
perl = "latest"
ruby = "latest"
rust = "latest"
beads = "latest"
hk = "latest"
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"
usage = "latest"

# databases
duckdb = "latest"
sqlite = "latest"

# secrets management
bitwarden = "latest"
bitwarden-secrets-manager = "latest"
fnox = "latest"

# AI tools
"npm:claude-plugins" = "latest"
"npm:skills-installer" = "latest"

# Other tools
pitchfork = "latest"

[tool_alias]

[plugins]

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["ruby", "elixir", "python"]
